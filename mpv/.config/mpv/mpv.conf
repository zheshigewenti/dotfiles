##################
# video settings #
##################
# 视频硬件解码API选择（Mac 下 auto 会自动调用 videotoolbox）
hwdec=auto
# 使用 mpv 下一代高性能渲染引擎（gpu-next）
vo=gpu-next
# 配合 gpu-next 的优质音视频同步模式
video-sync=display-resample

# --- 窗口尺寸控制（匹配 Mac 自带播放器舒适大小） ---
# 开启高分屏缩放适配，防止在 Mac 屏幕上缩得太小
hidpi-window-scale=yes
# 换片时自动根据新视频的分辨率调整窗口大小
auto-window-resize=yes
# 限制最大窗口不超过屏幕的 92%（防止 4K 视频撑爆屏幕）
autofit-larger=92%
# 强制将小视频（如 720P）在打开时，自动放大适配到占屏幕宽高的 65%
autofit=65%x65%
# 修复语法错误：让窗口默认居中显示在屏幕正中央
geometry=50%:50%

##################
# audio settings #
##################
# 设定程序启动后的默认音量
volume=100
# 优化 Mac 音频报错：如果 coreaudio 声道冲突，自动降级用 avfoundation 兼容
ao=coreaudio,avfoundation
# 强制输出标准双声道，彻底根治底层输入通道布局报错（-50错误）
audio-channels=stereo

##################
# sub / subtitle #
##################
# 优先加载中文字幕，其次是英文字幕
slang=zh,eng
# 字幕默认编码格式
sub-codepage=utf8:gb18030
# 字幕大小与样式
sub-font-size=40
sub-shadow-offset=0
sub-color="#ffffffff"
# sub-font="STZhongsong"

##################
# OSD / OSC      #
##################
# 关闭播放器原生突兀的白色 OSD 进度条
no-osd-bar
osd-font-size=20
# osd-level=1
# osd-font="STZhongsong"
# osd-duration=600
# osd-border-size=1
# osd-bar-h=1
# osd-bar-w=60

# 调整自带 OSC 界面在窗口化和全屏下的缩放比例，以及自动隐藏时间（2秒）
script-opts=osc-scalewindowed=0.5,osc-scalefullscreen=0.5,osc-hidetimeout=2000

##################
# other settings #
##################
# 记住断点（退出时保存播放进度）
save-position-on-quit

# 如播放的为图片文件，则给定秒数显示文件（默认1秒）
image-display-duration=1

# 截屏设置备用（如需启用，删掉前面的 # 号即可）
# screenshot-directory=~/Desktop/
# screenshot-format=png
# screenshot-template=mpv-screenshot-%f-%p

