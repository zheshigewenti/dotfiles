##################
# video settings #
##################
hwdec=auto
vo=gpu-next
video-sync=display-resample

# --- 高级画质与色彩管理 ---
scale=ewa_lanczossharp
dscale=mitchell
icc-profile-auto=yes
tone-mapping=bt.2390

# --- 窗口尺寸控制 ---
hidpi-window-scale=yes
auto-window-resize=yes
autofit-larger=92%
autofit=65%x65%

##################
# audio settings #
##################
volume=100
ao=coreaudio,avfoundation
audio-channels=stereo
# 最大音量上限（mpv 合法范围 100-1000，默认 130）
volume-max=140

##################
# sub / subtitle #
##################
slang=zh,eng
sub-codepage=utf8:gb18030
sub-font-size=40
sub-shadow-offset=0
sub-color="#ffffffff"

##################
# OSD / OSC      #
##################
no-osd-bar
osd-font-size=20
# osc=no

##################
# other settings #
##################
no-input-default-bindings
save-position-on-quit
image-display-duration=1
